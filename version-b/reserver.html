<!DOCTYPE html>

<head>

<title>Réserver · La Nuit du Comptoir</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0F0C">

<style>
:root{--ban:28px}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#0A0F0C}
body{font:300 1rem/1.6 'Poppins',system-ui,sans-serif;background:#0A0F0C;color:#F7EBD3;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit}
.demo{position:fixed;inset:0 0 auto;height:var(--ban);z-index:90;background:#050806;color:rgba(247,235,211,.6);font-size:.66rem;letter-spacing:.1em;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 10px;border-bottom:1px solid rgba(247,235,211,.12)}
.top{position:relative;padding:calc(var(--ban) + 20px) 0 150px;overflow:hidden;isolation:isolate}
.top::before{content:"";position:absolute;inset:0;z-index:-2;background:url(../assets/v2/nuit-foule.jpg) center 35%/cover;opacity:.5}
.top::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,15,12,.7),rgba(10,15,12,.5) 45%,#0A0F0C),radial-gradient(circle at 85% 20%,rgba(207,85,61,.35),transparent 45%)}
.w{width:min(1240px,92vw);margin:auto;position:relative;z-index:1}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px}
.bar img{height:42px;width:auto}
.bar .r{display:flex;align-items:center;gap:14px}
.bk{font:500 .74rem 'Poppins';letter-spacing:.14em;text-transform:uppercase;text-decoration:none;opacity:.75}.bk:hover{opacity:1;color:#C8A15A}
.lang{display:flex;border:1px solid rgba(247,235,211,.15);border-radius:999px;padding:2px}
.lang button{background:none;border:0;color:inherit;font:600 .68rem 'Poppins';padding:6px 10px;border-radius:999px;cursor:pointer;letter-spacing:.1em;opacity:.6}
.lang button.on{background:#C8A15A;color:#0A0F0C;opacity:1}
.hd{margin-top:66px;max-width:820px}
.hd p{font:600 .7rem 'Poppins';letter-spacing:.34em;text-transform:uppercase;color:#CF553D}
.hd h1{font:800 clamp(2.8rem,7vw,6.2rem)/.88 'Poppins';letter-spacing:-.045em;text-transform:uppercase;margin:16px 0 18px}
.hd h1 em{font:italic 400 1.04em 'DM Serif Display',serif;text-transform:none;letter-spacing:-.02em;color:#C8A15A}
.hd span{opacity:.78}
#resa{margin-top:-110px;position:relative;z-index:2;
  --rs-sans:'Poppins',system-ui,sans-serif;--rs-serif:'DM Serif Display',Georgia,serif;
  --rs-ink:#F7EBD3;--rs-mute:rgba(247,235,211,.62);--rs-bg:#111915;--rs-card:#18231D;--rs-line:rgba(247,235,211,.13);
  --rs-acc:#C8A15A;--rs-acc-ink:#0A0F0C;--rs-side:#050806;--rs-gold:#C8A15A;--rs-err:#F08B73;--rs-shadow:0 50px 120px rgba(0,0,0,.6)}
#resa .rs-in{background:#0E1511;color:#F7EBD3}
#resa .rs-in::placeholder{color:rgba(247,235,211,.35)}
#resa .rs-day:not(:disabled):hover{background:rgba(200,161,90,.15)}
#resa .rs-done-b{background:#111915}
.help{display:flex;justify-content:center;gap:10px;padding:34px 0 60px;font-size:.88rem;color:rgba(247,235,211,.6)}
.help a{color:#C8A15A;text-decoration:none;border-bottom:1px solid #C8A15A}
@media (max-width:980px){:root{--ban:24px}.demo{font-size:.58rem}.top{padding-bottom:120px}.hd{margin-top:40px}.bk{display:none}#resa{margin-top:-90px}.help{padding-bottom:120px;flex-direction:column;align-items:center;text-align:center}}
</style>
</head>
<body>
<div class="demo" data-i18n="demo">Maquette de démonstration · version Nuit</div>
<header class="top">
  <div class="w">
    <div class="bar"><a href="./"><img src="../assets/img/logo_or_c.png" alt="Le Comptoir"></a><div class="r"><a class="bk" href="./" data-i18n="rp_back">← Retour au site</a><div class="lang" role="group" aria-label="Langue"><button data-l="fr" class="on">FR</button><button data-l="en">EN</button></div></div></div>
    <div class="hd"><p data-i18n="rp_ey">Réservation</p><h1 data-i18n="rp_h">Votre nuit<br><em>commence ici.</em></h1><span data-i18n="rp_s">Une table pour toute la soirée, une simple entrée ou la liste d'attente : choisissez, on vous confirme sur WhatsApp.</span></div>
  </div>
</header>
<main class="w"><div id="resa"></div>
<p class="help"><span data-i18n="rp_q">Un grand groupe, une privatisation ?</span><a href="https://wa.me/2250798974607" target="_blank" rel="noopener" data-i18n="rp_help">Écrivez-nous sur WhatsApp</a></p></main>

<script src="i18n.js"></script>

  events:[{date:'2026-11-28',name:'Velvet Night',from:'22:00'}],

    moments:{matin:'../assets/img/matin.jpg',brunch:'../assets/img/brunch.jpg',dejeuner:'../assets/v2/lieu-assiette.jpg',diner:'../assets/v2/lieu-table.jpg',soiree:'../assets/v2/nuit-bleu.jpg'},
    zones:{salle:'../assets/v2/lieu-salle.jpg',fenetre:'../assets/v2/lieu-table.jpg',bar:'../assets/v2/nuit-verre.jpg',terrasse:'../assets/img/terrasse.jpg',egal:''}}});
LC.hooks.push(function(l){R.setLang(l)});
</script>
</body>
</html>
